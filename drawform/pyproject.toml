[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drawform"
version = "0.1.0"
description = "汽绘 DrawForm — 3D 模型到 2D 工程图智能生成平台（几何内核）"
requires-python = ">=3.11"
dependencies = [
    "cadquery-ocp>=8.0",
    "ezdxf>=1.4",
    "numpy>=1.26",
    "pydantic>=2.0",
    # PDF 出口用它的矢量后端。此前只被 import、从没写进依赖，
    # 新环境按这份清单装完，出图会在 PDF 那一步静默失败。
    "matplotlib>=3.8",
    # 服务端骨架（python -m drawform.service）。
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
